Diagnostics:
  ClangTidy:
    Add: [clang-analyzer-*,cppcoreguidelines-*,bugprone-*,performance-*,readability-*,readability-non-const-parameter,misc-const-correctness,misc-use-anonymous-namespace,google-explicit-constructor,-bugprone-exception-escape,-cppcoreguidelines-pro-bounds-constant-array-index,-cppcoreguidelines-avoid-magic-numbers,-bugprone-easily-swappable-parameters,-cppcoreguidelines-non-private-member-variables-in-classes]
    Remove: [readability-uppercase-literal-suffix, readability-identifier-length]

CompileFlags:
  Add: [-Wall, -Wextra, -Wshadow, -Wno-c++98-compat, -Wno-missing-prototypes, -Wno-pre-c++20-compat-pedantic]

Completion:
  HeaderInsertion: Never
